name: Build DonateStudio EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: donatestudio-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'
        cache-dependency-path: requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        python -m pip install pyinstaller

    - name: Build with PyInstaller
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        if (-not (Test-Path "fonts/BNazanin.ttf")) {
          throw "fonts/BNazanin.ttf missing; cannot bundle Persian font."
        }
        python -m PyInstaller build.spec
        if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with exit code $LASTEXITCODE" }
        if (-not (Test-Path "dist/DonateStudio/DonateStudio.exe")) {
          throw "dist/DonateStudio/DonateStudio.exe not found after build."
        }
        $files = (Get-ChildItem -Path "dist/DonateStudio" -Recurse -File | Measure-Object).Count
        Write-Host "Build OK: DonateStudio.exe + $files files in bundle."

    - name: Upload Windows build
      uses: actions/upload-artifact@v4
      with:
        name: DonateStudio_Windows
        path: dist/DonateStudio/**
        if-no-files-found: error
